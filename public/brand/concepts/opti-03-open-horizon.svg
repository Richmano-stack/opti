  <text x="190" y="127" fill="#1A1C1C" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="-5">opti</text>
  <text x="194" y="158" fill="#5A413B" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="3">OPEN HORIZON</text>
