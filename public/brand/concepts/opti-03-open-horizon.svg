<svg xmlns="http://www.w3.org/2000/svg" width="640" height="200" viewBox="0 0 640 200" role="img" aria-labelledby="title desc">
  <title id="title">Opti Open Horizon logo concept</title>
  <desc id="desc">An open orange O containing a blue horizon line and rising purple point, followed by the Opti wordmark.</desc>
  <rect width="640" height="200" rx="32" fill="#F9F9F9"/>
  <g transform="translate(48 40)">
